name: super play1

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Create RDP User
        run: |
          # إنشاء مستخدم جديد باسم RDP وتعيين كلمة المرور
          sudo dscl . -create /Users/RDP
          sudo dscl . -create /Users/RDP UserShell /bin/zsh
          sudo dscl . -create /Users/RDP RealName "RDP User"
          sudo dscl . -create /Users/RDP UniqueID "502"
          sudo dscl . -create /Users/RDP PrimaryGroupID 20
          sudo dscl . -create /Users/RDP NFSHomeDirectory /Users/RDP
          sudo dscl . -passwd /Users/RDP "Yahia@2yahiA"
          sudo createhomedir -c -u RDP
          sudo dscl . -append /Groups/admin GroupMembership RDP

      - name: Enable Screen Sharing / Remote Desktop
        run: |
          # تفعيل مشاركة الشاشة (VNC / RDP على macOS)
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

      - name: Install Tailscale
        run: |
          echo "Installing Tailscale via Homebrew..."
          brew install tailscale
          
          # تشغيل خدمة Tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          echo "Starting Tailscale connection..."
          
          # تفعيل الاتصال باستخدام صيغة github الصحيحة لتجنب مشكلة الرموز
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-mac-${{ github.run_id }} --accept-routes
          
          # الانتظار للحصول على IP
          tsIP=""
          retries=0
          maxRetries=20
          
          while [ -z "$tsIP" ] && [ $retries -lt $maxRetries ]; do
              sleep 3
              tsIP=$(tailscale ip -4 2>/dev/null || true)
              if [ -n "$tsIP" ]; then
                  tsIP=$(echo "$tsIP" | tr -d '\r\n')
              else
                  echo "Waiting for Tailscale IP... (attempt $((retries + 1))/$maxRetries)"
                  retries=$((retries + 1))
              fi
          done
          
          if [ -z "$tsIP" ]; then
              echo "Failed to get Tailscale IP after $maxRetries attempts"
              exit 1
          fi
          
          echo "Tailscale IP obtained: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

      - name: Display System Info
        run: |
          echo "========================================"
          echo "معلومات النظام"
          echo "========================================"
          echo "نظام التشغيل: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "المعالج: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
          echo "عدد الأنوية: $(sysctl -n hw.ncpu)"
          echo "الذاكرة: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"
          echo "========================================"

      - name: Display Connection Info
        run: |
          echo ""
          echo "========================================"
          echo "    VNC / Screen Sharing جاهز للاتصال"
          echo "========================================"
          echo "العنوان: $TAILSCALE_IP"
          echo "المستخدم: RDP"
          echo "كلمة المرور: Yahia@2yahiA"
          echo "========================================"
          echo "ملاحظة: يمكنك الاتصال باستخدام أي عميل VNC"
          echo "أو تطبيق Screen Sharing على جهاز Mac آخر عبر vnc://$TAILSCALE_IP"
          echo "========================================"
          echo ""

      - name: Maintain Connection
        run: |
          counter=0
          while true; do
              counter=$((counter + 1))
              echo "[$counter] [$(date +'%H:%M:%S')] الاتصال نشط..."
              sleep 300
          done
