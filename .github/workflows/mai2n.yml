name: super play1

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Create User & Configure VNC
        run: |
          # إنشاء مستخدم RDP
          sudo dscl . -create /Users/RDP
          sudo dscl . -create /Users/RDP UserShell /bin/zsh
          sudo dscl . -create /Users/RDP RealName "RDP User"
          sudo dscl . -create /Users/RDP UniqueID "502"
          sudo dscl . -create /Users/RDP PrimaryGroupID 20
          sudo dscl . -create /Users/RDP NFSHomeDirectory /Users/RDP
          sudo dscl . -passwd /Users/RDP "Yahia@2yahiA"
          sudo createhomedir -c -u RDP
          sudo dscl . -append /Groups/admin GroupMembership RDP

          # تفعيل Apple Remote Desktop وخدمة VNC على المنفذ 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -vncpasswd "Yahia@2yahiA" \
            -restart -agent -privs -all

      - name: Install Tailscale
        run: |
          echo "Installing Tailscale via Homebrew..."
          brew install tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          echo "Starting Tailscale connection..."
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-mac-${{ github.run_id }} --accept-routes
          
          tsIP=""
          retries=0
          maxRetries=20
          
          while [ -z "$tsIP" ] && [ $retries -lt $maxRetries ]; do
              sleep 3
              tsIP=$(tailscale ip -4 2>/dev/null || true)
              if [ -n "$tsIP" ]; then
                  tsIP=$(echo "$tsIP" | tr -d '\r\n')
              else
                  echo "Waiting for Tailscale IP... (attempt $((retries + 1))/$maxRetries)"
                  retries=$((retries + 1))
              fi
          done
          
          if [ -z "$tsIP" ]; then
              echo "Failed to get Tailscale IP after $maxRetries attempts"
              exit 1
          fi
          
          echo "Tailscale IP obtained: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

      - name: Display Connection Info
        run: |
          echo ""
          echo "========================================"
          echo "    VNC / Screen Sharing جاهز للاتصال"
          echo "========================================"
          echo "العنوان (IP): $TAILSCALE_IP"
          echo "المنفذ (Port): 5900"
          echo "كلمة مرور VNC: Yahia@2yahiA"
          echo "========================================"

      - name: Maintain Connection
        run: |
          counter=0
          while true; do
              counter=$((counter + 1))
              echo "[$counter] [$(date +'%H:%M:%S')] الاتصال نشط..."
              sleep 300
          done
