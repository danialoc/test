name: super play1 (macOS Version)

on:
  workflow_dispatch:

jobs:
  secure-vnc-mac:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable High Performance & Prevent Sleep
        run: |
          echo -e "\033[36mتفعيل وضع الأداء العالي ومنع السكون...\033[0m"
          sudo pmset -a sleep 0
          sudo pmset -a displaysleep 0
          sudo pmset -a disablesleep 1
          echo -e "\033[32mتم تفعيل وضع الأداء العالي بنجاح!\033[0m"

      - name: Bypass macOS Screen Recording Protection (TCC)
        run: |
          echo -e "\033[36mجاري كسر حماية الشاشة (TCC Database)...\033[0m"
          sudo killall tccd || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('kTCCServiceScreenCapture', 'com.apple.screensharing.agent', 0, 2, 4, 1, 0);" || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('kTCCServiceScreenCapture', 'com.apple.RemoteDesktop.agent', 0, 2, 4, 1, 0);" || true
          echo -e "\033[32mتم حقن صلاحيات الشاشة بنجاح!\033[0m"

      - name: Configure Screen Sharing (VNC)
        run: |
          echo -e "\033[36mإعداد خدمة الاتصال عن بُعد (VNC)...\033[0m"
          
          # تفعيل خدمة VNC باستخدام نظام المصادقة القديم (كلمة مرور 8 أحرف فقط)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "Yahia@2y" \
            -restart -agent
            
          # إنعاش الشاشة لتجنب السكون
          osascript -e 'tell application "System Events" to key code 123' || true

          echo -e "\033[32mتم إعداد خدمة VNC بنجاح!\033[0m"

      - name: Install Tailscale
        run: |
          echo -e "\033[36mجاري تثبيت Tailscale...\033[0m"
          
          brew install tailscale
          sudo tailscaled --tun=utun6 > /dev/null 2>&1 &
          sleep 5
          
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-$GITHUB_RUN_ID --accept-routes
          
          TS_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          
          echo -e "\033[32mتم تثبيت Tailscale والحصول على IP: $TS_IP\033[0m"

      - name: Display Connection Info
        run: |
          echo ""
          echo -e "\033[32m========================================\033[0m"
          echo -e "\033[36m   سيرفر الماك جاهز للاتصال\033[0m"
          echo -e "\033[32m========================================\033[0m"
          echo -e "\033[33mالعنوان (Tailscale IP): $TAILSCALE_IP\033[0m"
          echo -e "\033[33mكلمة المرور للـ VNC: Yahia@2y\033[0m"
          echo -e "\033[31mملاحظة: استخدم برنامج TigerVNC للاتصال\033[0m"
          echo -e "\033[32m========================================\033[0m"

      - name: Maintain Connection
        run: |
          COUNTER=0
          while true; do
            COUNTER=$((COUNTER+1))
            UPTIME=$(uptime | awk -F'( |,|:)+' '{print $6" "$7", "$8" hours, "$9" minutes"}')
            echo "[$COUNTER] $(date '+%H:%M:%S') الاتصال نشط - Uptime: $UPTIME"
            sleep 300
          done
